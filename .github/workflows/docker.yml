name: Builder Imagen

on:
  push:
    branches: [main]

  workflow_dispatch: # Manual

permissions:
  contents: read

jobs:
  revisar:
    name: Lint y Construccion
    runs-on: ubuntu-latest

    steps:
      - name: Importar Checkout
        uses: actions/checkout@v4

      - name: Lint de la receta
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
        
  construir:
    name: construir
    needs: revisar
    runs-on: ubuntu-lastest
  
    steps:
      - name: Construir Image
        uses: actions/checkout@v4
        run: docker build -t etiqueta .
          
