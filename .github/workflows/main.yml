name: Builder Imagen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Importar Checkout
        uses: actions/checkout@v4

      - name: Lint de la receta
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008, DL4006


  construir-linux:
    needs: revisar
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t servidor-minecraft:latest .

      - name: Exportar imagen
        run: docker save servidor-minecraft:latest -o servidor.tar

      - name: Subir imagen
        uses: actions/upload-artifact@v7
        with:
          name: imagen-docker-linux
          path: servidor.tar 
          compression-level: 0


  construir-windows:
    needs: revisar
    runs-on: windows-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t servidor-minecraft:latest .

      - name: Exportar imagen
        run: docker save servidor-minecraft:latest -o servidor.tar

      - name: Subir imagen
        uses: actions/upload-artifact@v7
        with:
          name: imagen-docker-windows
          path: servidor.tar 
          compression-level: 0
          

  importar-linux:
    runs-on: ubuntu-latest
    needs: construir-linux

    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v8
        with:
          name: imagen-docker-linux

      - name: Verificar imagen
        run: ls -lh servidor.tar

      - name: Cargar imagen de docker
        run: docker load -i servidor.tar

      - name: Verificar importacion
        run: |
          docker images
          docker inspect servidor-minecraft:latest
          
  importar-windows:
    runs-on: windows-latest
    needs: construir-windows

    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v8
        with:
          name: imagen-docker-windows

      - name: Verificar imagen
        shell: pwsh
        run: Get-Item servidor.tar

      - name: Cargar imagen de docker
        shell: pwsh
        run: docker load -i servidor.tar

      - name: Verificar importacion
        shell: pwsh
        run: |
          docker images
          docker inspect servidor-minecraft:latest
          
      
